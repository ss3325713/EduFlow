{% extends 'base.html' %}

{% block title %}{{ 'Edit Class' if cls else 'Add Class' }} — {{ super() }}{% endblock %}
{% block header_title %}{{ 'Edit Class' if cls else 'Add New Class' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg);">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('classes.edit', class_id=cls.id) if cls else url_for('classes.add') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Class Name *</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Class 11 Science" value="{{ cls.name if cls else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Class Code *</label>
                        <input type="text" name="code" class="form-control" placeholder="e.g. C11-SCI" value="{{ cls.code if cls else '' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold small">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Optional description">{{ cls.description if cls else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('classes.index') }}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">{{ 'Save Changes' if cls else 'Create Class' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
