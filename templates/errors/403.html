{% extends 'base.html' %}
{% block title %}403 Forbidden — {{ super() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold">403</div>
    <h3 class="fw-bold text-dark mt-2">Access Forbidden</h3>
    <p class="text-muted col-md-6 mx-auto">You do not have permission to access this administrative resource or perform this action.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 fw-semibold mt-3"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
</div>
{% endblock %}
