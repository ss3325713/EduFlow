{% extends 'base.html' %}
{% block title %}404 Not Found — {{ super() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-primary fw-bold">404</div>
    <h3 class="fw-bold text-dark mt-2">Page Not Found</h3>
    <p class="text-muted col-md-6 mx-auto">The requested page or record does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 fw-semibold mt-3"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
</div>
{% endblock %}
