{% extends 'base.html' %}
{% block title %}500 Internal Server Error — {{ super() }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold">500</div>
    <h3 class="fw-bold text-dark mt-2">Internal Server Error</h3>
    <p class="text-muted col-md-6 mx-auto">An unexpected system error occurred. Our engineering log has recorded this incident.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 fw-semibold mt-3"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
</div>
{% endblock %}
