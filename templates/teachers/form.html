{% extends 'base.html' %}

{% block title %}Register Teacher — {{ super() }}{% endblock %}
{% block header_title %}Register Faculty Member{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg);">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('teachers.add') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <h5 class="fw-bold text-dark mb-3">Login Credentials</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">First Name *</label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Last Name *</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Username *</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Email Address *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Initial Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Default: Teacher@123">
                        </div>
                    </div>

                    <h5 class="fw-bold text-dark mb-3">Qualifications & Expertise</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Mobile Number</label>
                            <input type="text" name="mobile" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Highest Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="e.g. M.Sc Physics, Ph.D.">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label text-secondary fw-semibold small">Specialization / Domain</label>
                            <input type="text" name="specialization" class="form-control" placeholder="e.g. Organic Chemistry, Quantum Mechanics, JEE Calculus">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('teachers.index') }}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Register Teacher</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
