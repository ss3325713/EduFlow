{% extends 'base.html' %}

{% block title %}Add Subject — {{ super() }}{% endblock %}
{% block header_title %}Add New Subject{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg);">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('subjects.add') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Subject Name *</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Physics" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Subject Code *</label>
                        <input type="text" name="code" class="form-control" placeholder="e.g. PHY-101" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Class *</label>
                        <select name="class_id" class="form-select" required>
                            <option value="">Select Class</option>
                            {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold small">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Optional description"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('subjects.index') }}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Add Subject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
