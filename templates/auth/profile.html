{% extends 'base.html' %}

{% block title %}My Profile — {{ super() }}{% endblock %}
{% block header_title %}Account Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg);">
            <div class="card-body p-4">
                <h5 class="fw-bold text-dark mb-3">Profile Information</h5>
                <form method="POST" action="{{ url_for('auth.profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ current_user.first_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ current_user.last_name }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold small">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                    </div>

                    <hr class="my-4">

                    <h5 class="fw-bold text-dark mb-3">Change Password</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary fw-semibold small">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
