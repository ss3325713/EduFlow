{% extends 'base.html' %}

{% block title %}Set New Password — EduFlow Academy{% endblock %}

{% block auth_content %}
<div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card border-0 shadow-lg" style="border-radius: 20px;">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem; border-radius: 14px;">E</div>
                <h4 class="fw-bold text-dark mb-1">Set New Password</h4>
                <p class="text-muted small">Enter a new secure password for your account.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold small">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Minimum 6 characters" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                        <input type="password" name="confirm_password" class="form-control border-start-0 ps-0" placeholder="Re-enter new password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3" style="border-radius: 10px;">
                    Update Password <i class="bi bi-check-circle ms-1"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
