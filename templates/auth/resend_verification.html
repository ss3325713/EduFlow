{% extends 'base.html' %}

{% block title %}Resend Verification — EduFlow Academy{% endblock %}

{% block auth_content %}
<div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card border-0 shadow-lg" style="border-radius: 20px;">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem; border-radius: 14px;">E</div>
                <h4 class="fw-bold text-dark mb-1">Resend Email Verification</h4>
                <p class="text-muted small">Enter your email address below to receive a new account verification link.</p>
            </div>

            <form method="POST" action="{{ url_for('auth.resend_verification') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small">Account Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="your.email@domain.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3" style="border-radius: 10px;">
                    Send Verification Link <i class="bi bi-envelope-at ms-1"></i>
                </button>

                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
